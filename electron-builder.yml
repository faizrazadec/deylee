# Packaging configuration for Dayly.
#
# Dayly stores nothing off-device and sends no telemetry. The single exception is the
# update check: `publish` at the bottom points electron-builder at GitHub Releases so
# it emits the `latest*.yml` manifests electron-updater polls. That check is a user
# preference (Settings › Updates) and downloads never start without consent.

appId: me.faizraza.dayly
productName: Dayly
copyright: Copyright © 2026 Muhammad Faiz Raza

directories:
  buildResources: build
  output: release

# An allow-list of what actually runs: the electron-vite bundles plus the manifest
# Electron reads `main` and the app name from. Production dependencies are collected
# separately — electron-builder applies only the *negative* patterns from `files`
# when it walks node_modules — so better-sqlite3 still ships without being listed.
#
# LICENSE is not code, but MIT asks for the notice to travel with "all copies or
# substantial portions of the Software", and a downloaded .dmg or .exe is a copy.
files:
  - out/**/*
  - package.json
  - LICENSE

# Tray artwork is read from disk at runtime rather than bundled, so it has to live
# outside the asar. `trayResourcePath()` resolves to `process.resourcesPath/tray/…`,
# so the contents of resources/ are copied to the root of the resources directory —
# `to: resources` would nest them at `process.resourcesPath/resources/tray` and every
# packaged build would show a blank tray icon.
extraResources:
  - from: resources
    to: .

asar: true
# A native addon cannot be dlopen'd from inside an asar archive, so better-sqlite3's
# compiled binary is unpacked next to it.
asarUnpack:
  - '**/*.node'
  - node_modules/better-sqlite3/**
  # The macOS status-item addon. It is what holds the menu-bar selection highlight,
  # which Electron's own Tray cannot do; without it the app still runs, just without
  # the highlight. Listed explicitly as well as via '**/*.node' so the whole package —
  # its index.js loader, not only the binary — lands outside the asar.
  - node_modules/@dayly/mac-status-item/**

# better-sqlite3 must be built against Electron's V8 ABI, not the host Node's.
npmRebuild: true

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  extendInfo:
    # A genuine menu-bar app: no dock tile, no Cmd-Tab entry, no main menu. Pairs
    # with `app.dock.hide()` in MacPlatform — the plist key is what keeps the icon
    # from flashing into the dock during launch, before any JavaScript runs.
    LSUIElement: true

dmg:
  # Shown when the .dmg is mounted, before the drag-to-Applications window. Named
  # explicitly rather than left to electron-builder's `license_en.txt` convention,
  # so there is one licence text in the repo and no second copy to drift from it.
  # The path resolves against the project root, and an explicit path is passed to
  # the DMG as-is — only the convention files are rewritten in place to add a BOM.
  license: LICENSE

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
        - arm64

# The Microsoft Store build. Deliberately not in `win.target`: an appx can only be
# assembled by `makeappx.exe` from the Windows SDK, so adding it there would break
# `npm run dist:win` on every non-Windows machine. It is built on demand instead —
# `npx electron-builder --win appx` on Windows or the CI Windows runner.
#
# The Store signs the package itself, so no certificate is needed here. That is the
# whole reason this route is cheaper than the NSIS one, which needs a paid OV/EV
# certificate to get past SmartScreen.
appx:
  # These three must match the reservation in Partner Center byte-for-byte; a mismatch
  # is rejected at upload, not at build time. From Product → Product identity.
  identityName: MuhammadFaizRaza.Dayly-TimeTracker
  publisher: CN=A99F7A34-BB95-40D5-ADFD-6BD317696A8D
  publisherDisplayName: Muhammad Faiz Raza
  # The reserved name, which is why it differs from `productName` above: plain "Dayly"
  # was already taken in the Store by an unrelated diary app. Every other target keeps
  # the short name.
  displayName: Dayly - Time Tracker
  applicationId: DaylyTimeTracker
  # Dayly is a menu-bar app with no live tile to show; a transparent backplate keeps the
  # icon from sitting on a coloured square in the Start menu.
  backgroundColor: transparent
  showNameOnTiles: false
  languages:
    - en-US

nsis:
  # A per-user install with a visible wizard: no admin prompt, and the user picks
  # the directory. Dayly writes only to its own userData folder, so machine-wide
  # installation would buy nothing.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Dayly
  # The same root LICENSE the DMG shows, as the wizard's licence page. A file with
  # no extension is fine here: only `.html` is special-cased, and everything else is
  # handed to NSIS as plain text.
  license: LICENSE

linux:
  # A directory, not the single 1024x1024 build/icon.png that mac and win use:
  # electron-builder installs each NxN.png here into hicolor/NxN/apps/, and a lone
  # oversized icon is invisible to AppStream, which only reads conventional sizes.
  icon: build/icons
  # Matches the registered snap name, and by extension the Microsoft Store listing.
  # This is the *only* lever on the snap's name — electron-builder derives it as
  # `executableName.toLowerCase()` and exposes no snap-specific override — so it also
  # renames the binary and the .desktop file in the .deb and the AppImage. The
  # autostart entry LinuxPlatform writes is named to match; the two must agree or
  # "Launch at login" writes a file nothing ever reads.
  executableName: dayly-time-tracker
  category: Utility
  synopsis: Local-only time tracker that lives in your tray
  description: >-
    Dayly tracks working hours from the system tray. Everything stays on this
    machine in a single SQLite file: no account, no cloud, no telemetry.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  desktop:
    entry:
      # Matches the WM_CLASS Electron reports, so the shell groups the running app
      # with its launcher icon instead of showing a second, generic entry.
      StartupWMClass: Dayly

# The Snap Store build.
#
# Deliberately not in `linux.target`, for the same reason `appx` is not in `win.target`:
# it needs snapcraft and an initialised LXD, which a bare machine — including a stock
# GitHub runner — does not have. Listing it there would break `npm run dist:linux`
# everywhere and fail the Linux leg of a tagged release. It is built on demand instead:
#
#   npx electron-builder --linux snap        # on a Linux box with snapcraft + LXD
#
# macOS cannot build it at all; electron-builder raises "No snap build environment
# specified for darwin". The build machine must match the target architecture, because
# better-sqlite3 is compiled against Electron's ABI for the host — an amd64 snap needs
# an amd64 builder.
# `snapcraft`, not the older `snap` key. The key decides the build strategy, not just
# where the options live: only a `snapcraft` block reaches the core24 builder, which
# drives `snapcraft pack`. The legacy `snap` key routes to a builder that still calls
# `snapcraft snap` — a subcommand removed in snapcraft 8, so it fails outright on any
# current toolchain.
snapcraft:
  # core24 tracks Ubuntu 24.04. electron-builder's floor for it is Electron 25+, and
  # 28+ recommended; Dayly is on 43, comfortably inside.
  base: core24
  # Options for the selected base are nested under a key named after it — electron-builder
  # reads `snapcraft[snapcraft.base]`, so anything at the top level here is ignored.
  core24:
    # Strict confinement is the whole game here: classic confinement is the single
    # biggest trigger for manual store review, and Dayly does not need it. Its database
    # lives under the snap's own user directory, which needs no interface at all.
    # The registered snap name is `dayly` — snap names allow only lowercase letters,
    # digits and hyphens, so the Store's "Dayly - Time Tracker" cannot be one. `title`
    # is the name users actually see in the store and the desktop, and it carries the
    # spaces and capitals the name cannot, so Dayly reads the same on every platform
    # while still installing as `snap install dayly`.
    title: Dayly - Time Tracker
    # The one-line blurb under the title in the store. Without it electron-builder falls
    # back to `productName`, so the listing would read "Dayly" and say nothing at all.
    # `linux.synopsis` does not reach the snap; only this does.
    summary: Local-only time tracker that lives in your tray
    confinement: strict
    grade: stable
    # Build inside an LXD container rather than on the host.
    #
    # Not a preference: destructive (host) builds are incompatible with the `gnome`
    # extension, which core24 relies on, and electron-builder responds by silently
    # dropping every extension. The extension's own GPU wrapper then tries to install
    # into /snap/command-chain and the build dies. LXD gives snapcraft the root-owned,
    # isolated filesystem it expects, and keeps whatever happens to be on the build
    # machine from leaking into the snap.
    useLXD: true
    # `plugs` replaces electron-builder's defaults rather than extending them. Every
    # entry below auto-connects on a normal distribution and none is super-privileged,
    # so none of this diverts the upload into a human review queue.
    plugs:
      # Both are needed for the tray, not one or the other: `desktop-legacy` carries the
      # AppArmor rules that let the app own a StatusNotifierItem name and register it,
      # while `unity7` carries the matching com.canonical.dbusmenu rules. With only one
      # of the pair the icon has historically appeared but its menu silently died.
      - desktop
      - desktop-legacy
      - unity7
      - x11
      - wayland
      # Exports and backups the user picks in a save dialog.
      - home
      - opengl
      - gsettings
      - browser-support
    # Deliberately absent: `network` and `network-bind`, both of which electron-builder
    # would otherwise include. Dayly opens no sockets and the Store owns updates, so an
    # unused network permission would be a claim the app cannot justify.
    #
    # Also deliberately absent: `personal-files` and `system-files`. Those are
    # super-privileged, need an approved snap-declaration from Canonical, and are the one
    # place a young project genuinely would be judged on its age.
    stagePackages:
      - default
      # electron-builder's default list still names libappindicator3-1, which no longer
      # exists in current Debian or Ubuntu. The Ayatana successor is what actually
      # provides a StatusNotifierItem host — the same substitution deb.recommends makes.
      - libayatana-appindicator3-1
    # Emits the autostart entry into the snap, which is what makes the "Launch at login"
    # preference work: snapd reads $SNAP_USER_DATA/.config/autostart, exactly where
    # LinuxPlatform already writes, but only when the snap declares it here.
    autoStart: true

deb:
  # dpkg requires a maintainer in `Name <email>` form and electron-builder will not
  # build the package without one. It falls back to the `author` field in package.json,
  # which is a bare name with no address, so it is stated explicitly here rather than
  # putting an email into package.json where npm would also publish it.
  maintainer: Muhammad Faiz Raza <faiz.raza.dec@gmail.com>
  # `depends` replaces electron-builder's defaults rather than extending them, so
  # the stock Electron runtime dependencies are repeated here alongside libgtk-3-0
  # and libnotify4, which the tray and desktop notifications need.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - xdg-utils
  # The stock recommend, libappindicator3-1, is gone from current Debian and Ubuntu;
  # its Ayatana successor is what actually provides a StatusNotifierItem host. It is
  # a recommend, not a depend, because Dayly falls back to the mini-window without it.
  recommends:
    - libayatana-appindicator3-1

# `--publish always` in CI uploads the artifacts *and* the latest.yml / latest-mac.yml /
# latest-linux.yml manifests. Those manifests are the whole update feed — without them
# electron-updater has nothing to compare against and no client ever updates.
#
# Auto-update reaches Linux (AppImage) and Windows (NSIS) only. macOS is signature-gated
# by Squirrel.Mac and .deb has no updater at all; on those the app links to the Releases
# page instead. See UpdateService for the gate.
publish:
  - provider: github
    owner: faizrazadec
    repo: dayly
