# The sync API, its database and the Cloudflare tunnel in front of it, as production runs
# them.
#
#     docker compose up -d db                # once; it is left alone after that
#     docker compose build api
#     docker compose up -d --no-deps api     # replace the API, leave db and tunnel running
#
# Run from the repository root: the image's build context is this directory, narrowed by
# the root .dockerignore to the three server/ paths the Dockerfile copies.
#
# The api and tunnel read server/.env, which is untracked and holds every secret — including
# the tunnel token. The database reads server/env.db instead, which holds only its superuser
# password, so the API never has a credential that skips row-level security. Nothing in
# this file is a secret, and nothing secret belongs in it.
#
# The project name is pinned rather than taken from the directory, so the stack, its
# network and the deylee_deylee-db volume are the same wherever the checkout lives.
# Change it and compose starts a second stack beside the first, with an empty database.
name: deylee

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: deylee-api:latest
    container_name: deylee-api
    restart: unless-stopped
    env_file: server/.env
    # Two levels, like an ECS task and its containers. deylee.slice (server/deylee.slice,
    # installed into systemd) caps the whole stack at 1 CPU and 1 GB; each service's own
    # limits cap it inside that. As in ECS, the services' limits add up to less than the
    # parent (0.95 CPU, 960 MB) — nothing checks that, so keep it true when changing one.
    # Without the slice installed, systemd creates it empty and only the per-service
    # limits apply. At 100 users the API used about 1% of a core and under 50 MB.
    cgroup_parent: deylee.slice
    cpus: 0.3
    mem_limit: 256m
    ports:
      - "8080:8080"
    # The signed Sparkle appcast and update archives. Read-only: the API serves them and
    # must never be able to change what every installed copy of the app will download.
    volumes:
      - /srv/deylee-updates:/srv/updates:ro
    depends_on:
      db:
        condition: service_healthy

  # No published port: only containers on this network reach it, so the API connects to
  # db:5432 with TLS off (DEYLEE_DB_TLS=disable). Migrations, backups and psql go through
  # `docker exec` — see server/scripts/migrate.sh and nightly-db.sh.
  db:
    image: postgres:17-alpine
    container_name: deylee-db
    restart: unless-stopped
    env_file: server/env.db
    # Most of the budget. Postgres's defaults (128 MB shared_buffers) fit inside it with
    # room for the page cache, and a year of 100 users peaked at about 465 MB.
    cgroup_parent: deylee.slice
    cpus: 0.55
    mem_limit: 576m
    volumes:
      - deylee-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 3s
      retries: 5

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: deylee-tunnel
    restart: unless-stopped
    env_file: server/.env
    command: tunnel --no-autoupdate run
    cgroup_parent: deylee.slice
    cpus: 0.1
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy

# The data outlives every container. `docker compose down -v` deletes it; never pass -v.
#
# No networks block: compose's default network is enough. The IPv6 one existed only for
# Supabase's AAAA-only host, and its fixed subnet collides with any second stack.
volumes:
  deylee-db:
