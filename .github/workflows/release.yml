name: release

# Tags are the trigger, and `npm run release` is what creates them. Nothing publishes
# from a branch push — a release is always something you tagged on purpose.
on:
  push:
    tags: ['v*']
  # Lets you re-run a failed platform without cutting a new tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.2.0)
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Required for GITHUB_TOKEN to create the Release and upload assets.
  contents: write

jobs:
  build:
    strategy:
      # One platform failing must not cancel the others: a green Linux build is still
      # worth publishing while a Windows runner issue is investigated.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall that rebuilds better-sqlite3 against Electron's
      # ABI. It needs a C++ toolchain, which all three GitHub runners ship by default.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # electron-builder only packages what is already on disk — it does not invoke
      # the bundler. Without this step it would ship a stale or empty out/ directory.
      - name: Build bundles
        run: npm run build

      - name: Package and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There is no signing identity in CI yet. Left on, electron-builder would
          # hunt the keychain for one and fail the macOS build rather than producing
          # an unsigned artifact. See README › Signing for what this costs to fix.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Kept even on failure so a partially-built matrix leg is still inspectable.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dayly-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap

  # The Snap Store build, deliberately a separate job rather than another leg of the
  # matrix above.
  #
  # Two reasons. It needs snapcraft and an initialised LXD, which the other legs do not,
  # and it publishes to a different place — the Snap Store, not the GitHub Release. And
  # because `snap` is not in `linux.target`, the matrix job never builds one, so nothing
  # here duplicates what it does.
  #
  # Each architecture is built on its own native runner. That is not a preference:
  # better-sqlite3 is a native module, and cross-building it was tried and fails
  # ("node-gyp failed to rebuild better-sqlite3" for x64 on an arm64 host).
  snap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: amd64
          # Free and unlimited on public repositories, generally available since
          # August 2025. It will NOT run on a private repository.
          - os: ubuntu-24.04-arm
            name: arm64

    name: Snap ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The Snap Store is a separate destination from the GitHub Release. A store outage,
    # an expired credential or a rejected revision must not mark the whole release
    # failed when the installers themselves published fine.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Set up snapcraft and LXD
        run: |
          sudo snap install snapcraft --classic
          sudo lxd init --auto
          sudo usermod -aG lxd "$USER"

      # `sg lxd -c` matters: usermod does not affect the shell already running, so
      # without it snapcraft cannot reach the LXD socket and the build fails on a
      # permission error that looks nothing like a group problem.
      #
      # `--publish always` hands the finished snap to electron-builder's snapStore
      # publisher, which runs `snapcraft upload --release <channels>` using
      # SNAPCRAFT_STORE_CREDENTIALS. Channels come from `snapcraft.core24.publish`.
      - name: Build and publish snap
        run: sg lxd -c "npx electron-builder --linux snap --${{ matrix.name == 'amd64' && 'x64' || 'arm64' }} --publish always"
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dayly-snap-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: ignore
          path: release/*.snap
